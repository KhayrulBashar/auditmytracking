<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="icoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="icoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="icoLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="30" fill="url(#icoGrad)" stroke="url(#icoBorder)" stroke-width="3.5" />

  <!-- Analytics Columns (bigger, centered) -->
  <rect x="30" y="66" width="10" height="30" rx="4" fill="#475569" />
  <rect x="47" y="50" width="10" height="46" rx="4" fill="#6366F1" />
  <rect x="64" y="38" width="10" height="58" rx="4" fill="#818CF8" />
  <rect x="81" y="26" width="10" height="70" rx="4" fill="#38BDF8" />

  <!-- Data Stream Path (bigger, bolder) -->
  <path d="M24 74 L52 52 L68 62 L94 30" stroke="url(#icoLine)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Live Event Pulse Beacon -->
  <circle cx="94" cy="30" r="6" fill="#10B981" />
  <circle cx="94" cy="30" r="2.6" fill="#FFFFFF" />
</svg>
