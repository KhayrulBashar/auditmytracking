<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="icoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="icoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="icoLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="30" fill="url(#icoGrad)" stroke="url(#icoBorder)" stroke-width="3" />

  <!-- Analytics Columns -->
  <rect x="36" y="58" width="7" height="24" rx="3" fill="#475569" />
  <rect x="49" y="44" width="7" height="38" rx="3" fill="#6366F1" />
  <rect x="62" y="34" width="7" height="48" rx="3" fill="#818CF8" />
  <rect x="75" y="24" width="7" height="58" rx="3" fill="#38BDF8" />

  <!-- Data Stream Path -->
  <path d="M28 66 L50 48 L64 56 L86 28" stroke="url(#icoLine)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="86" cy="28" r="4.5" fill="#10B981" />
  <circle cx="86" cy="28" r="2" fill="#FFFFFF" />

  <!-- AMT Badge at Bottom -->
  <rect x="36" y="92" width="56" height="20" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="64" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#38BDF8" letter-spacing="3" text-anchor="middle">
    AMT
  </text>
</svg>
